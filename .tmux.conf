# ~/.tmux.conf
# Requires tmux >= 3.3 (uses %hidden variables, terminal-features, copy-command,
# and the *-style options). Reload with: prefix + r
#
# Used on: Ubuntu/Debian (native + WSL) and macOS (iTerm2). Often attached
# over SSH from iTerm2 (Mac) or Windows Terminal (Win 11), so everything here
# avoids special fonts (no powerline glyphs) and copies via OSC 52.


# ============================================================================
#  Colour palette (Tokyo Night inspired)
#  Change the theme here in one place; the values are used below as $NAME.
#  Note: $VARs are only expanded inside "double quotes" or unquoted strings.
# ============================================================================
%hidden BG="#1f2335"        # status bar background
%hidden SURFACE="#3b4261"   # secondary blocks (date, inactive borders)
%hidden FG="#c0caf5"        # main text
%hidden MUTED="#828bb8"     # inactive window text
%hidden ACCENT="#7aa2f7"    # current window, active pane border, session name
%hidden PREFIX="#ff9e64"    # session block turns this colour while prefix is held
%hidden HILITE="#e0af68"    # messages / command prompt
%hidden ALERT="#f7768e"     # bell
%hidden DARK="#1a1b26"      # text drawn on top of coloured blocks


# ============================================================================
#  Terminal
# ============================================================================
# tmux-256color supports italics etc. If a remote host lacks the terminfo
# entry, fall back to "screen-256color".
set -g default-terminal "tmux-256color"
# Tell tmux the outer terminal supports 24-bit colour (needed for the #hex
# colours above to render exactly instead of being approximated).
set -as terminal-features ",xterm*:RGB"

set -sg escape-time 10        # don't wait 500ms after <Esc> (makes vim snappy)
set -g  focus-events on       # pass focus events to apps (vim autoread, etc.)
set -g  history-limit 50000   # scrollback lines per pane


# ============================================================================
#  General behaviour
# ============================================================================
# Prefix: C-a instead of C-b. Press C-a twice to send a literal C-a.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Number windows and panes from 1 (matches the keyboard layout).
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on   # close window 2 of 1,2,3 -> becomes 1,2

set -g mouse on               # click to select panes/windows, drag to resize, wheel to scroll
set -g allow-rename off       # don't let programs rename windows

# Quiet: no bells, no activity notifications.
set  -g visual-activity off
set  -g visual-bell off
set  -g visual-silence off
set  -g bell-action none
setw -g monitor-activity off

# Reload this file.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"


# ============================================================================
#  Windows & panes
# ============================================================================
# New windows / splits open in the current pane's directory.
# Splits follow vim's naming: s = horizontal line (top/bottom), v = side by side.
# (Overrides defaults: s = choose-session, v = unbound.)
bind c new-window   -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Move between panes: prefix + h/j/k/l (like vim's C-w h/j/k/l) ...
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ... or Alt + arrow without the prefix.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize panes like vim. -r = repeatable: after prefix, press the key
# multiple times without re-pressing prefix.
bind -r < resize-pane -L 1
bind -r > resize-pane -R 1
bind -r - resize-pane -D 1
bind -r + resize-pane -U 1

# Shift + Left/Right: previous/next window.
# Shift + Up/Down: move current window left/right in the list (focus follows).
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n S-Up    swap-window -t -1 \; select-window -t -1
bind -n S-Down  swap-window -t +1 \; select-window -t +1


# ============================================================================
#  Copy mode (vi keys)
#  1. prefix + [   enter copy mode
#  2. v / V / C-v  start selection / line selection / toggle rectangle
#  3. y            copy to tmux buffer + system clipboard and exit
#  4. prefix + p   paste (overrides default p = previous-window)
# ============================================================================
setw -g mode-keys vi

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel   # pipes to copy-command
bind p paste-buffer

# System clipboard -- two mechanisms, both run on every copy:
#
#  1. OSC 52 (set-clipboard on): tmux asks the terminal you're typing in to
#     put the text on *its* clipboard. This is what makes copy work when you
#     ssh in from Mac/Windows and attach: the text lands on your laptop, not
#     on the remote server. Works with iTerm2 (enable "Applications in
#     terminal may access clipboard") and Windows Terminal (on by default).
#
#  2. copy-command: a local clipboard tool on the machine running tmux, for
#     terminals without OSC 52 (e.g. GNOME Terminal). If it fails (e.g. no
#     desktop session when attached over SSH) nothing breaks; OSC 52 still works.
#     Skipped on WSL: OSC 52 via Windows Terminal handles it, and clip.exe
#     garbles non-ASCII (e.g. Chinese) text.
set -s set-clipboard on
if-shell "command -v pbcopy >/dev/null" {
    set -s copy-command "pbcopy"                              # macOS
}
if-shell "! grep -qi microsoft /proc/version 2>/dev/null" {
    if-shell "command -v xclip >/dev/null" {
        set -s copy-command "xclip -selection clipboard -in"  # Linux X11
    }
    if-shell "command -v wl-copy >/dev/null" {
        set -s copy-command "wl-copy"                         # Linux Wayland (wins if both)
    }
}


# ============================================================================
#  Look & feel
# ============================================================================
# --- Status bar ---
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=$BG,fg=$FG"

# Left: session name; turns orange while the prefix key is active.
set -g status-left-length 30
set -g status-left "#[fg=$DARK,bold]#{?client_prefix,#[bg=$PREFIX],#[bg=$ACCENT]} #S #[default] "

# Right: hostname, date, time.
set -g status-right-length 60
set -g status-right "#[fg=$MUTED] #h #[fg=$FG,bg=$SURFACE] %b %d #[fg=$DARK,bg=$ACCENT,bold] %H:%M "

# Window list. #I = index, #W = name, #F = flags (* current, - last, Z zoomed).
setw -g window-status-separator ""
setw -g window-status-style         "fg=$MUTED,bg=$BG"
setw -g window-status-format        " #I:#W#F "
setw -g window-status-current-style "fg=$DARK,bg=$ACCENT,bold"
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag, Z,} "
setw -g window-status-bell-style    "fg=$DARK,bg=$ALERT,bold"

# --- Pane borders ---
set -g pane-border-style        "fg=$SURFACE"
set -g pane-active-border-style "fg=$ACCENT"

# --- Messages / command prompt (prefix + :) ---
set -g message-style         "fg=$DARK,bg=$HILITE,bold"
set -g message-command-style "fg=$HILITE,bg=$BG"

# --- Copy-mode selection & choose-tree highlight ---
setw -g mode-style "fg=$DARK,bg=$HILITE"

# --- Clock (prefix + t) ---
setw -g clock-mode-colour "$ACCENT"


# ============================================================================
#  Plugins (tpm). Install tpm first:
#    git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#  then prefix + I to install plugins.
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions (prefix + C-s / C-r)
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save via resurrect

set -g @continuum-save-interval '5'            # minutes
set -g @continuum-restore 'on'                 # auto-restore when tmux server starts
set -g @resurrect-capture-pane-contents 'on'

# Must stay at the very bottom (continuum hooks into status-right set above).
run '~/.tmux/plugins/tpm/tpm'
